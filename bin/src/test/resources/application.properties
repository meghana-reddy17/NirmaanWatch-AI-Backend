spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:nirmaanwatch_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
nirmaanwatch.cors.allowed-origins=http://localhost:5173
nirmaanwatch.evidence.dir=${java.io.tmpdir}/nirmaanwatch-test-evidence
nirmaanwatch.seed-demo=false
nirmaanwatch.anonymous-reports-enabled=true
nirmaanwatch.login.max-attempts=20
nirmaanwatch.login.window-seconds=60
nirmaanwatch.ai.provider=none
