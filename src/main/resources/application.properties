spring.application.name=nirmaanwatch-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.name=NIRMAANWATCH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/nirmaanwatch?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${MYSQL_USER:nirmaanwatch}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=${EVIDENCE_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${EVIDENCE_MAX_REQUEST_SIZE:6MB}

nirmaanwatch.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
nirmaanwatch.evidence.dir=${EVIDENCE_STORAGE_DIR:../evidence-storage}
nirmaanwatch.evidence.max-bytes=${EVIDENCE_MAX_BYTES:5242880}
nirmaanwatch.seed-demo=${NIRMAANWATCH_SEED_DEMO:true}
nirmaanwatch.demo-password=${NIRMAANWATCH_DEMO_PASSWORD:ChangeMe_Demo1!}
nirmaanwatch.anonymous-reports-enabled=${ANONYMOUS_REPORTS_ENABLED:true}
nirmaanwatch.login.max-attempts=${LOGIN_MAX_ATTEMPTS:8}
nirmaanwatch.login.window-seconds=${LOGIN_WINDOW_SECONDS:900}
nirmaanwatch.ai.provider=${AI_PROVIDER:none}

logging.level.com.nirmaanwatch=INFO
logging.level.org.springframework.security=INFO
